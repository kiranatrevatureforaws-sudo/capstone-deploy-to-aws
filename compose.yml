services:
  angular-app:
    build:
      context: ./angular-app
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - product-service
      - catalog-service
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

  product-service:
    build:
      context: ./product-service
    expose:
      - "8081"
    environment:
      SERVER_PORT: "8081"
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"

  catalog-service:
    build:
      context: ./catalog-service
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      PRODUCT_SERVICE_BASE_URL: http://product-service:8081
    depends_on:
      - product-service
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "3"
