name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect changed applications
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changes.outputs.images }}
      services: ${{ steps.changes.outputs.services }}
      deploy: ${{ steps.changes.outputs.deploy }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed applications
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          base_sha="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            base_sha=""
          fi

          all_apps=false
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            all_apps=true
            changed_files=""
          else
            changed_files="$(git diff --name-only "$base_sha" "$HEAD_SHA")"
          fi

          product=false
          catalog=false
          angular=false
          deploy=false

          if [[ "$all_apps" == true ]]; then
            product=true
            catalog=true
            angular=true
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              product-service/README.md|product-service/*.md|product-service/.gitignore|product-service/.gitattributes) continue ;;
              catalog-service/README.md|catalog-service/*.md|catalog-service/.gitignore|catalog-service/.gitattributes) continue ;;
              angular-app/README.md|angular-app/*.md|angular-app/.gitignore|angular-app/.gitattributes) continue ;;
            esac

            case "$file" in
              product-service/*) product=true ;;
              catalog-service/*) catalog=true ;;
              angular-app/*) angular=true ;;
              shared-java/*|common/*|pom.xml|settings.xml|.mvn/*|mvnw|mvnw.cmd)
                product=true
                catalog=true
                ;;
            esac

            case "$file" in
              compose.yml|deploy.sh|rollback.sh) deploy=true ;;
            esac
          done <<< "$changed_files"

          [[ "$product" == true || "$catalog" == true || "$angular" == true ]] && deploy=true

          images=()
          services=()
          [[ "$product" == true ]] && images+=(product-service) && services+=(product-service)
          [[ "$catalog" == true ]] && images+=(catalog-service) && services+=(catalog-service)
          [[ "$angular" == true ]] && images+=(angular-app) && services+=(angular-app)

          if ((${#images[@]} == 0)); then
            images_json='["none"]'
            services_list=""
          else
            images_json="$(printf '%s\n' "${images[@]}" | jq -R . | jq -sc .)"
            services_list="${services[*]}"
          fi

          {
            echo "images=$images_json"
            echo "services=$services_list"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: CI - ${{ matrix.application }}
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        application: ${{ fromJSON(needs.detect-changes.outputs.images) }}
    steps:
      - name: Check out source
        if: matrix.application != 'none'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 21
        if: matrix.application == 'product-service' || matrix.application == 'catalog-service'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            product-service/pom.xml
            catalog-service/pom.xml

      - name: Test and build product-service
        if: matrix.application == 'product-service'
        run: mvn --batch-mode --no-transfer-progress -f product-service/pom.xml clean verify

      - name: Test and build catalog-service
        if: matrix.application == 'catalog-service'
        run: mvn --batch-mode --no-transfer-progress -f catalog-service/pom.xml clean verify

      - name: Set up Node.js 22
        if: matrix.application == 'angular-app'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: angular-app/package-lock.json

      - name: Install Angular dependencies
        if: matrix.application == 'angular-app'
        run: npm ci
        working-directory: angular-app

      - name: Test Angular app
        if: matrix.application == 'angular-app'
        run: npm test -- --watch=false
        working-directory: angular-app

      - name: Build Angular app
        if: matrix.application == 'angular-app'
        run: npm run build
        working-directory: angular-app

  docker-build-push:
    name: Build and push ${{ matrix.application }}
    needs: [detect-changes, ci]
    if: >-
      needs.detect-changes.outputs.images != '["none"]' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    strategy:
      fail-fast: false
      matrix:
        application: ${{ fromJSON(needs.detect-changes.outputs.images) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.application }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.application }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.application }}
          cache-to: type=gha,mode=max,scope=${{ matrix.application }}

  deploy:
    name: Deploy changed applications
    needs: [detect-changes, ci, docker-build-push]
    if: >-
      always() &&
      needs.detect-changes.outputs.deploy == 'true' &&
      needs.ci.result == 'success' &&
      (needs.docker-build-push.result == 'success' || needs.docker-build-push.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: capstone-single-application-environment
      cancel-in-progress: false
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure SSH, sync deployment files, and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
          EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
        shell: bash
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_HOST_KEY DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            [[ -n "${!name}" ]] || { echo "Missing required GitHub secret: $name" >&2; exit 1; }
          done
          [[ "$DOCKERHUB_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid Docker Hub username" >&2; exit 1; }
          [[ "$EC2_SSH_PORT" =~ ^[0-9]+$ ]] || { echo "Invalid EC2_SSH_PORT" >&2; exit 1; }

          key_file="$RUNNER_TEMP/ec2_deploy_key"
          known_hosts_file="$RUNNER_TEMP/ec2_known_hosts"
          archive="$RUNNER_TEMP/capstone-deploy-${GITHUB_SHA}.tar.gz"
          trap 'rm -f -- "$key_file" "$known_hosts_file" "$archive"' EXIT

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$EC2_HOST_KEY" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"
          tar -czf "$archive" \
            compose.yml deploy.sh rollback.sh \
            product-service/Dockerfile product-service/.dockerignore \
            catalog-service/Dockerfile catalog-service/.dockerignore \
            angular-app/Dockerfile angular-app/.dockerignore

          ssh_common=(-i "$key_file" -o UserKnownHostsFile="$known_hosts_file" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          scp "${ssh_common[@]}" -P "$EC2_SSH_PORT" "$archive" "$EC2_USER@$EC2_HOST:/tmp/capstone-${GITHUB_SHA}.tar.gz"

          remote_images=()
          for service in $CHANGED_SERVICES; do
            remote_images+=("$service=$GITHUB_SHA")
          done
          remote_args="${remote_images[*]}"
          remote_command="set -eu; trap 'docker logout >/dev/null 2>&1 || true; rm -f \"/tmp/capstone-${GITHUB_SHA}.tar.gz\"' EXIT; docker login --username '${DOCKERHUB_USERNAME}' --password-stdin; mkdir -p \"\$HOME/capstone-project\"; tar -xzf \"/tmp/capstone-${GITHUB_SHA}.tar.gz\" -C \"\$HOME/capstone-project\"; cd \"\$HOME/capstone-project\"; bash deploy.sh '${GITHUB_RUN_NUMBER}' '${DOCKERHUB_USERNAME}' $remote_args"
          printf '%s' "$DOCKERHUB_TOKEN" | ssh "${ssh_common[@]}" -p "$EC2_SSH_PORT" "$EC2_USER@$EC2_HOST" \
            "$remote_command"

  verify-deployment:
    name: Verify deployment health
    needs: [detect-changes, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Verify services through Nginx
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
          EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_HOST_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing required GitHub secret: $name" >&2; exit 1; }
          done
          [[ "$EC2_SSH_PORT" =~ ^[0-9]+$ ]] || { echo "Invalid EC2_SSH_PORT" >&2; exit 1; }
          key_file="$RUNNER_TEMP/ec2_deploy_key"
          known_hosts_file="$RUNNER_TEMP/ec2_known_hosts"
          trap 'rm -f -- "$key_file" "$known_hosts_file"' EXIT
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$EC2_HOST_KEY" > "$known_hosts_file"
          chmod 600 "$known_hosts_file"
          ssh -i "$key_file" -p "$EC2_SSH_PORT" \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            'cd "$HOME/capstone-project" &&
             docker compose --env-file .env -f compose.yml ps &&
             docker compose --env-file .env -f compose.yml exec -T angular-app wget -q -O /dev/null http://localhost:8080/api/products &&
             docker compose --env-file .env -f compose.yml exec -T angular-app wget -q -O /dev/null http://localhost:8080/api/catalog/products'
